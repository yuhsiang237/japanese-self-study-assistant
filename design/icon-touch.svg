<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- apple-touch-icon 原稿：滿版石墨漸層（iOS 會自行套用連續曲率圓角遮罩），符號與 favicon 完整版一致 -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48484a" />
      <stop offset="1" stop-color="#1c1c1e" />
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e5e5ea" />
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect width="64" height="64" fill="url(#tile)" />
  <g fill="url(#glyph)" filter="url(#lift)">
    <path
      fill-rule="evenodd"
      d="M30 13A21 21 0 0 0 51 34A21 21 0 0 0 30 55A21 21 0 0 0 9 34A21 21 0 0 0 30 13Z
         M28.5 30v8l7-4Z"
    />
    <path d="M50 8A6 6 0 0 0 56 14A6 6 0 0 0 50 20A6 6 0 0 0 44 14A6 6 0 0 0 50 8Z" />
  </g>
</svg>
